<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 AI·SW체험 수피아여고 포토부스</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header { text-align: center; padding: 20px 10px 0; }
  .school { font-size: 14px; letter-spacing: 3px; color: #aaa; }
  h1 { font-size: 22px; margin: 6px 0 0; }

  .guide { font-size: 15px; color: #ffd166; margin: 12px 0 0; min-height: 22px; text-align: center; }

  .stage {
    position: relative;
    width: min(90vw, 480px);
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 12px;
  }
  #video, #preview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #video { transform: scaleX(-1); }
  #preview { display: none; }

  .live {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #e33;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
  }

  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px #000;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-size: 16px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #captureBtn { background: #2b7cff; }
  #printBtn { background: #21b573; }
  #retryBtn { background: #555; }

  .status { font-size: 14px; color: #ff8a8a; min-height: 20px; text-align: center; padding: 0 16px; }

  /* 화면에서는 숨기고, 인쇄할 때만 영수증 영역을 보여줌 */
  #receipt { display: none; }

  @page {
    size: 80mm auto;   /* 58mm 용지라면 58mm로 변경 */
    margin: 0;
  }
  @media print {
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      width: 80mm;
      background: #fff;
    }
    #receipt img {
      display: block;
      width: 80mm;
      image-rendering: pixelated;
    }
  }
</style>
</head>
<body>

<header>
  <div class="school">SPEER HIGH SCHOOL</div>
  <h1>2026 AI·SW체험 수피아여고 포토부스</h1>
</header>

<p class="guide" id="guide">카메라를 바라보고 버튼을 눌러주세요</p>

<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="preview" alt="촬영 미리보기">
  <span class="live">LIVE</span>
  <div id="countdown"></div>
</div>

<div class="controls">
  <button id="captureBtn" disabled>촬영하기</button>
  <button id="printBtn" disabled>영수증 인쇄하기</button>
  <button id="retryBtn" disabled>다시 촬영하기</button>
</div>

<p class="status" id="status"></p>

<!-- 인쇄 전용 영역 -->
<div id="receipt">
  <img id="receiptImg" alt="영수증 이미지">
</div>

<script>
  const RECEIPT_WIDTH = 576; // 80mm 감열 프린터(약 203dpi) 기준 가로 점 수

  const video = document.getElementById('video');
  const preview = document.getElementById('preview');
  const countdownEl = document.getElementById('countdown');
  const captureBtn = document.getElementById('captureBtn');
  const printBtn = document.getElementById('printBtn');
  const retryBtn = document.getElementById('retryBtn');
  const guideEl = document.getElementById('guide');
  const statusEl = document.getElementById('status');
  const receiptImg = document.getElementById('receiptImg');

  let stream = null;
  let receiptData = null;

  function setStatus(msg) { statusEl.textContent = msg; }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // 카메라 시작
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      captureBtn.disabled = false;
    } catch (err) {
      console.error(err);
      guideEl.textContent = '';
      setStatus('카메라를 사용할 수 없습니다. 카메라 권한을 허용했는지 확인해 주세요.');
    }
  }

  // 3초 카운트다운 후 촬영
  captureBtn.addEventListener('click', async () => {
    captureBtn.disabled = true;
    setStatus('');
    for (let i = 3; i > 0; i--) {
      countdownEl.style.display = 'flex';
      countdownEl.textContent = i;
      await sleep(1000);
    }
    countdownEl.style.display = 'none';
    takePhoto();
  });

  function takePhoto() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    // 좌우 반전된 컬러 원본 캡처
    const canvas = document.createElement('canvas');
    canvas.width = vw;
    canvas.height = vh;
    const ctx = canvas.getContext('2d');
    ctx.translate(vw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, vw, vh);

    // 미리보기: 컬러
    preview.src = canvas.toDataURL('image/jpeg', 0.92);
    video.style.display = 'none';
    preview.style.display = 'block';

    // 인쇄용: 흑백 디더링
    receiptData = makeReceiptImage(canvas);
    receiptImg.src = receiptData;

    guideEl.textContent = '영수증 사진이 완성되었습니다!';
    setStatus('');
    printBtn.disabled = false;
    retryBtn.disabled = false;
  }

  // 지그재그(serpentine) Floyd-Steinberg 디더링
  function makeReceiptImage(srcCanvas) {
    const w = RECEIPT_WIDTH;
    const h = Math.round(srcCanvas.height * (w / srcCanvas.width));

    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(srcCanvas, 0, 0, w, h);

    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;

    // 그레이스케일 변환
    const gray = new Float32Array(w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      gray[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    }

    function addErr(x, y, v) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      gray[y * w + x] += v;
    }

    for (let y = 0; y < h; y++) {
      const ltr = y % 2 === 0;          // 짝수 줄: 왼→오, 홀수 줄: 오→왼
      const dir = ltr ? 1 : -1;
      for (let k = 0; k < w; k++) {
        const x = ltr ? k : w - 1 - k;
        const idx = y * w + x;
        const old = gray[idx];
        const nv = old < 128 ? 0 : 255;
        const err = old - nv;
        gray[idx] = nv;

        addErr(x + dir, y, err * 7 / 16);
        addErr(x - dir, y + 1, err * 3 / 16);
        addErr(x, y + 1, err * 5 / 16);
        addErr(x + dir, y + 1, err * 1 / 16);
      }
    }

    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const v = gray[p];
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    return c.toDataURL('image/png');
  }

  // 시스템(Windows 기본) 프린터로 인쇄
  printBtn.addEventListener('click', async () => {
    if (!receiptData) {
      setStatus('인쇄할 영수증이 없습니다. 먼저 촬영해 주세요.');
      return;
    }
    if (!receiptImg.complete) {
      await new Promise(r => { receiptImg.onload = r; });
    }
    window.print();
  });

  // 다시 촬영
  retryBtn.addEventListener('click', () => {
    receiptData = null;
    receiptImg.removeAttribute('src');
    preview.removeAttribute('src');
    preview.style.display = 'none';
    video.style.display = 'block';
    printBtn.disabled = true;
    retryBtn.disabled = true;
    captureBtn.disabled = false;
    guideEl.textContent = '카메라를 바라보고 버튼을 눌러주세요';
    setStatus('');
  });

  window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
  });

  startCamera();
</script>
</body>
</html>
